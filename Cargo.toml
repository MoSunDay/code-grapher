[workspace]
resolver = "2"
members = [
    "crates/cg-core",
    "crates/cg-db",
    "crates/cg-indexer",
    "crates/cg-analyzer",
    "crates/cg-server",
    "crates/cg-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
cg-core = { path = "crates/cg-core" }
cg-db = { path = "crates/cg-db" }
cg-indexer = { path = "crates/cg-indexer" }
cg-analyzer = { path = "crates/cg-analyzer" }
cg-server = { path = "crates/cg-server" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
libsql = "0.10"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
notify = "8"
notify-debouncer-full = "0.7"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tempfile = "3"

[profile.dev]
debug = 1
